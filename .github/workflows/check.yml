name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Frontmatter, plugin manifests and version
        run: |
          npm install --no-save --no-package-lock yaml@2.6.1
          node tests/frontmatter.mjs
